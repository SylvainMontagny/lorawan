# ########## IoT Platform #################### 
#        Influxdb, NodeRed, Grafana          #  
##############################################

services:

  nodered:
    image: montagny/node-red:latest
    container_name: nodered
    restart: unless-stopped
    volumes:
     - ./node_data:/data
     - ./scripts:/scripts
    dns:    # For WSL Desktop with instable DNS, use public DNS servers
      - 1.1.1.1
      - 8.8.8.8 
    user: root
    entrypoint: [ "bash", "/scripts/entrypoint.sh" ] 
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.nodered.rule=Host(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`)"
      - "traefik.http.routers.nodered.entrypoints=websecure"
      - "traefik.http.routers.nodered.tls.certresolver=myresolver"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"
    networks:
      - default
      - traefik
      
  influxdb:
    image: influxdb:2.7.11
    container_name: influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=univ-lorawan
      - DOCKER_INFLUXDB_INIT_ORG=training-usmb
      - DOCKER_INFLUXDB_INIT_BUCKET=iot-platform
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=U3lsdmFpbk1vbnRhZ255RXN0VW5DaGFtcGlvbl9Gb3JtYXRpb25Mb1JhV0FOX1VuaXZfU2F2b2llXzIwMjMhCg==
      - TZ=Europe/Paris
    volumes:
      - ./influx_data:/var/lib/influxdb2:rw
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.influxdb.rule=Host(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`)"
      - "traefik.http.routers.influxdb.entrypoints=influxsecure"
      - "traefik.http.routers.influxdb.tls.certresolver=myresolver"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"
    networks:
      - default
      - traefik
         
  grafana:
    user: "1000"
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=univ-lorawan
      - GF_SERVER_ROOT_URL=https://${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}:3000/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`)"
      - "traefik.http.routers.grafana.entrypoints=grafanasecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: traefik
       


