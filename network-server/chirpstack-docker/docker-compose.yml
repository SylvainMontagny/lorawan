services:
  chirpstack:
    image: chirpstack/chirpstack:4.17
    container_name: chirpstack
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
    ports:
      - "9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.chirpstackweb.rule=Host(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`)"
      - "traefik.http.routers.chirpstackweb.entrypoints=chirpstacksecure"
      - "traefik.http.routers.chirpstackweb.tls=true"
      - "traefik.http.routers.chirpstackweb.tls.certresolver=myresolver"
      - "traefik.http.routers.chirpstackweb.service=chirpstackweb"
      - "traefik.http.services.chirpstackweb.loadbalancer.server.port=8080"
      - "traefik.http.routers.chirpstack-grpc.rule=Host(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.chirpstack-grpc.entrypoints=chirpstacksecure"
      - "traefik.http.routers.chirpstack-grpc.tls.certresolver=myresolver"
      - "traefik.http.routers.chirpstack-grpc.service=chirpstack-grpc"
      - "traefik.http.services.chirpstack-grpc.loadbalancer.server.port=8080"
      - "traefik.http.services.chirpstack-grpc.loadbalancer.server.scheme=h2c"
    networks:
      - default
      - traefik

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4.1.1
    container_name: chirpstack-gateway-bridge
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto
  
  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4.1.1
    container_name: chirpstack-gateway-bridge-basicstation
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-eu868.toml
    ports:
      - "3001:3001"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4.17.0
    container_name: chirpstack-rest-api
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    depends_on:
      - chirpstack
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.chirpstack-api.rule=Host(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`) && PathPrefix(`/swagger`)"
      - "traefik.http.routers.chirpstack-api.entrypoints=chirpstacksecure"
      - "traefik.http.routers.chirpstack-api.tls.certresolver=myresolver"
      - "traefik.http.services.chirpstack-api.loadbalancer.server.port=8090"
    networks:
      - default
      - traefik

  postgres:
    image: postgres:14-alpine
    container_name: chirpstack-postgres
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    container_name: chirpstack-redis
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: chirpstack-mosquitto
    restart: unless-stopped
    volumes: 
      - ./configuration/mosquitto/config/:/mosquitto/config/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.tcp.routers.mosquitto.rule=HostSNI(`${DOMAIN_NAME:?Set DOMAIN_NAME in traefik/.env}`)"
      - "traefik.tcp.routers.mosquitto.entrypoints=mqttsecure"
      - "traefik.tcp.routers.mosquitto.tls.certresolver=myresolver"
      - "traefik.tcp.services.mosquitto.loadbalancer.server.port=1883"
    networks:
      - default
      - traefik

volumes:
  postgresqldata:
  redisdata:

networks:
  traefik:
    external: true
    name: traefik
