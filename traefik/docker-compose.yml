services:

  traefik:
    image: "traefik:latest"
    container_name: "traefik"
    command:
      # - "--log.level=DEBUG"
      # - "--accesslog=true"
      - "--accesslog.fields.names.defaultmode=keep"
      - "--accesslog.fields.names.ServiceName=keep"
      # - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.chirpstacksecure.address=:8080"
      - "--entrypoints.influxsecure.address=:8086"
      - "--entrypoints.grafanasecure.address=:3000"
      - "--entrypoints.mqttsecure.address=:8883"
      # Redirection HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt (HTTP-01)
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8086:8086"
      - "3000:3000"
      - "8883:8883"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    # labels:
    #   - "traefik.enable=true"
    #   # - "traefik.http.routers.dashboard.entrypoints=websecure"
    #   # - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
    #   - "traefik.http.routers.dashboard.service=api@internal"
    #   - "traefik.http.routers.dashboard.middlewares=auth"
    #   - "traefik.http.routers.dashboard.tls.certresolver=myresolver"
    #   # htpasswd -nbB test florent-pass
    #   - "traefik.http.middlewares.auth.basicauth.users=test:$$2y$05$$wqk7uSw1AxuZy9NM/OKUI.jCF8Hvf8YswdWiZl4CRb6Lph.RY6bkG,test2:$$apr1$$d9hr9HBB$$4HxwgUir3HP4EsggP/QNo0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - traefik

networks:
  traefik:
    name: traefik